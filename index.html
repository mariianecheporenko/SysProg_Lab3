<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Переглядач AST</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px system-ui, sans-serif; color: #1f2937; background: #f8fafc; }
    header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; background: white; border-bottom: 1px solid #e2e8f0; }
    h1 { margin: 0; font-size: 18px; }
    #status { color: #64748b; font-size: 13px; }
    input { max-width: 240px; }
    main { height: calc(100vh - 57px); }
    svg { width: 100%; height: 100%; cursor: grab; }
    svg:active { cursor: grabbing; }
    .link { fill: none; stroke: #cbd5e1; stroke-width: 1.5px; }
    .node circle { fill: white; stroke: #2563eb; stroke-width: 2px; }
    .node text { font-size: 13px; fill: #334155; }
    .node { cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>Дерево AST</h1>
    <label>Відкрити JSON: <input id="file" type="file" accept=".json,application/json"></label>
    <span id="status">Завантаження ast.json…</span>
  </header>
  <main><svg id="tree"></svg></main>

  <script>
    const svg = d3.select("#tree");
    const g = svg.append("g");
    const status = document.querySelector("#status");
    const tree = d3.tree().nodeSize([34, 190]);
    const zoom = d3.zoom().scaleExtent([0.2, 3]).on("zoom", e => g.attr("transform", e.transform));
    svg.call(zoom);

    function showTree(data, label) {
      if (!data || typeof data !== "object" || Array.isArray(data) || !("name" in data)) {
        throw new Error('Очікується об’єкт із полем "name".');
      }
      const root = d3.hierarchy(data, d => d.children);
      root.x0 = 0;
      root.y0 = 0;

      function update(source) {
        tree(root);
        const nodes = root.descendants();
        const links = root.links();

        const link = g.selectAll(".link").data(links, d => d.target.data._id || (d.target.data._id = Math.random()));
        link.enter().append("path").attr("class", "link")
          .merge(link).attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));
        link.exit().remove();

        const node = g.selectAll(".node").data(nodes, d => d.data._id || (d.data._id = Math.random()));
        const enter = node.enter().append("g").attr("class", "node")
          .attr("transform", `translate(${source.y0},${source.x0})`)
          .on("click", (event, d) => {
            if (d.children) { d._children = d.children; d.children = null; }
            else if (d._children) { d.children = d._children; d._children = null; }
            update(d);
          });
        enter.append("circle").attr("r", 6);
        enter.append("text").attr("dy", "0.32em")
          .attr("x", d => d.children || d._children ? -10 : 10)
          .attr("text-anchor", d => d.children || d._children ? "end" : "start")
          .text(d => d.data.name);
        node.merge(enter).attr("transform", d => `translate(${d.y},${d.x})`);
        node.exit().remove();

        nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
      }

      g.selectAll("*").remove();
      update(root);
      status.textContent = label + " · натисніть вузол, щоб згорнути/розгорнути";
      svg.call(zoom.transform, d3.zoomIdentity.translate(50, innerHeight / 2));
    }

    document.querySelector("#file").addEventListener("change", async event => {
      const file = event.target.files[0];
      if (!file) return;
      try { showTree(JSON.parse(await file.text()), file.name); }
      catch (error) { status.textContent = "Помилка: " + error.message; }
    });

    fetch("ast.json")
      .then(response => { if (!response.ok) throw new Error("ast.json не знайдено"); return response.json(); })
      .then(data => showTree(data, "ast.json"))
      .catch(() => { status.textContent = "Виберіть файл ast.json або покладіть його поруч з index.html."; });
  </script>
</body>
</html>
